spring.application.name=rag-assistant
spring.ai.ollama.chat.model=llama3.2
spring.ai.ollama.chat.temperature=0.3
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

# 2 tentatives maximum, attente courte entre les deux
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=5s

# Never expose the stack trace to the client (DevTools turns it on by default)
server.error.include-stacktrace=never
